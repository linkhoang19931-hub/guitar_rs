# Build bản Mac (universal: Apple Silicon + Intel) trên máy macOS của GitHub.
#
# - Mỗi lần đẩy code lên nhánh main: chạy test, build quickRS.app, đóng gói zip + dmg và giữ lại ở mục
#   Actions > (lần chạy) > Artifacts để tải về.
# - Đẩy một tag dạng v* (ví dụ v0.3.1): làm như trên và đăng thành bản phát hành (Releases) — bộ cập nhật trong
#   ứng dụng sẽ lấy bản ở đây.
# - Cũng có thể bấm chạy tay ở tab Actions (Run workflow).
#
# App được ký ad hoc, không notarize: lần đầu mở phải vào System Settings > Privacy & Security > Open Anyway.
name: build-mac

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust (the repo's toolchain, both Mac targets)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - name: libclang for bindgen
        run: |
          dev="$(xcode-select -p)"
          for d in "$dev/Toolchains/XcodeDefault.xctoolchain/usr/lib" "$dev/usr/lib" /Library/Developer/CommandLineTools/usr/lib; do
            if [ -f "$d/libclang.dylib" ]; then echo "LIBCLANG_PATH=$d" >> "$GITHUB_ENV"; echo "libclang: $d"; exit 0; fi
          done
          echo "no libclang.dylib" >&2; exit 1

      - uses: Swatinem/rust-cache@v2

      - name: Test (native arm64)
        run: cargo test --workspace

      - name: Build and bundle (universal)
        run: bash tools/mac/bundle.sh

      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: quickRS-${{ steps.ver.outputs.version }}-macos-universal
          path: |
            dist/mac/*.zip
            dist/mac/*.dmg
            dist/mac/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist/mac
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "quickRS ${TAG#v} (MusicXML)" \
              --notes "Bản Mac (universal) có nhập bài MusicXML. Lần đầu mở: System Settings > Privacy & Security > Open Anyway."
          gh release upload "$TAG" ./*.zip ./*.dmg SHA256SUMS.txt --clobber
